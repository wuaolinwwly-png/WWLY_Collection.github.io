<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDIO — 美术作品集</title>
<style>
    :root{
        --bg:#f3f0ea;
        --bg-image:none;
        --bg-overlay:1;
        --ink:#141210;
        --muted:#8d877d;
        --line:#dcd6cc;
        --header-solid:rgba(243,240,234,.82);
        --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
        --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
        --ease:cubic-bezier(.16,1,.3,1);
        --bounce:cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}

    body{
        font-family:var(--sans);
        background:var(--bg);
        color:var(--ink);
        line-height:1.65;
        -webkit-font-smoothing:antialiased;
        overflow-x:hidden;
        position:relative;
    }

    /* 页面背景图 + 可调遮罩层 */
    body::before{
        content:"";
        position:fixed;inset:0;z-index:-2;
        background-image:var(--bg-image);
        background-size:cover;
        background-position:center;
        background-attachment:fixed;
        transition:opacity .6s var(--ease);
    }
    body::after{
        content:"";
        position:fixed;inset:0;z-index:-1;
        background:var(--bg);
        opacity:var(--bg-overlay);
        transition:opacity .6s var(--ease),background .4s;
        pointer-events:none;
    }

    img{display:block;max-width:100%;}
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

    /* ============ 顶部导航 ============ */
    .site-header{
        position:fixed;top:0;left:0;right:0;z-index:80;
        transition:background .45s var(--ease),border-color .45s,backdrop-filter .45s;
        border-bottom:1px solid transparent;
    }
    .site-header.scrolled{
        background:var(--header-solid);
        backdrop-filter:blur(16px) saturate(1.3);
        -webkit-backdrop-filter:blur(16px) saturate(1.3);
        border-bottom-color:var(--line);
    }
    .header-inner{
        max-width:1440px;margin:0 auto;
        padding:0 clamp(20px,8vw,100px); 
        height:68px;
        display:flex;align-items:center;justify-content:space-between;
        gap:16px;
    }
    .header-left{display:flex;align-items:center;gap:clamp(16px,2.5vw,34px);}
    .brand{
        font-family:var(--serif);
        font-size:1.02rem;font-weight:600;
        letter-spacing:.02em;white-space:nowrap;
    }
    .brand span{color:var(--muted);font-weight:400;margin-left:.5em;font-size:.78em;letter-spacing:.16em;text-transform:uppercase;}
    .nav{display:flex;gap:clamp(14px,2.4vw,32px);list-style:none;}
    .nav a{
        font-size:.8rem;font-weight:500;color:var(--muted);
        letter-spacing:.04em;transition:color .25s;white-space:nowrap;
    }
    .nav a:hover{color:var(--ink);}

    /* 背景切换器 */
    .bg-switcher{display:flex;align-items:center;gap:8px;}
    .bg-dot{
        width:17px;height:17px;border-radius:50%;
        border:1px solid rgba(20,18,16,.18);
        background-size:cover;background-position:center;
        transition:transform .3s var(--ease),box-shadow .3s,border-color .3s;
        position:relative;
    }
    .bg-dot:hover{transform:scale(1.15);}
    .bg-dot.active{
        border-color:var(--ink);
        box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink);
    }

    /* ============ 视图切换 ============ */
    .view{display:none;}
    .view.is-active{display:block;animation:viewIn .6s var(--ease) both;}
    @keyframes viewIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

    /* ============ 主页全新布局 ============ */
    .home-scroll {
        max-width: 1440px;
        margin: 0 auto;
        padding: 0 clamp(20px, 8vw, 100px);
        display: flex;
        flex-direction: column;
        gap: clamp(50px, 6vh, 80px);
        padding-bottom: 80px;
    }

    .hero{
        padding-top:clamp(120px,15vh,160px);
        display:flex;align-items:flex-end;justify-content:space-between;
        gap:clamp(20px,4vw,60px);flex-wrap:wrap;
        animation:riseIn .9s var(--ease) both;
    }
    .hero-left{min-width:0;}
    .hero-eyebrow{
        font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;
        color:var(--muted);margin-bottom:clamp(8px,1.4vh,14px);
    }
    .hero h1{
        font-family:var(--serif);
        font-size:clamp(1.8rem,3.5vw,3rem);
        font-weight:500;line-height:1.22;letter-spacing:-.01em;
        max-width:22ch;
    }
    .hero-meta{
        display:flex;gap:clamp(20px,3vw,40px);flex-wrap:wrap;
        font-size:.74rem;color:var(--muted);
    }
    .hero-meta span{display:block;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:3px;color:#a8a297;}
    .hero-meta p{color:var(--ink);font-weight:500;font-size:.78rem;}
    @keyframes riseIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

    /* 每一排画廊的区块 */
    .gallery-section {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .gallery-title {
        font-size: .7rem;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: var(--muted);
        padding-left: 4px;
        border-left: 2px solid var(--ink);
        line-height: 1;
    }

    /* 横向滚动区域 */
    .series-viewport{
        width: 100%;
        height: clamp(260px, 35vh, 380px); 
        overflow: hidden;
        position: relative;
        cursor: grab; 
        padding: 10px 0;
    }
    .series-viewport:active{cursor:grabbing;}

    .series-track{
        display:flex;
        gap:clamp(10px,1.2vw,18px);
        height:100%;
        will-change:transform;
    }

    /* 画廊卡片 */
    .series-item{
        position:relative;overflow:hidden;
        background:#d8d2c7;cursor:pointer;
        height:100%;
        animation:itemIn 1s var(--ease) both;
        border-radius: 2px;
        z-index: 1;
        transition: transform 0.5s var(--bounce), box-shadow 0.5s, z-index 0s;
        will-change: transform;
    }
    
    /* 核心：动态计算宽度，刚好等分 */
    .cols-4 .series-item {
        flex: 0 0 calc((100% - 3 * clamp(10px,1.2vw,18px)) / 4);
    }
    .cols-3 .series-item {
        flex: 0 0 calc((100% - 2 * clamp(10px,1.2vw,18px)) / 3);
    }

    @keyframes itemIn{
        from { opacity: 0; transform: translateY(22px); }
        to { opacity: 1; transform: none; }
    }

    .series-item.is-hovered {
        transform: scale(1.04) translateY(-6px);
        box-shadow: 0 24px 48px rgba(0,0,0,0.22);
        z-index: 10;
    }

    .series-item img{
        position:absolute;inset:0;width:100%;height:100%;
        object-fit:cover;
        transition:transform 1.5s var(--ease),filter 1s;
        filter:saturate(.88) contrast(1.02);
        pointer-events:none;
    }
    .series-item.is-hovered img{
        transform:scale(1.03);
        filter:saturate(1.06) contrast(1.03);
    }

    .series-shade{
        position:absolute;inset:0;
        background:
            linear-gradient(to top,rgba(8,8,8,.8) 0%,rgba(8,8,8,.22) 44%,rgba(8,8,8,0) 70%),
            linear-gradient(to bottom,rgba(8,8,8,.4) 0%,rgba(8,8,8,0) 24%);
        transition:opacity .6s;
        pointer-events:none;
    }
    .series-item.is-hovered .series-shade{opacity:.94;}

    .series-num{
        position:absolute;top:clamp(12px,1.6vw,20px);left:clamp(12px,1.6vw,20px);
        z-index:2;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;
        color:rgba(255,255,255,.82);text-shadow:0 1px 6px rgba(0,0,0,.45);
        pointer-events:none;
    }

    .series-info{
        position:absolute;left:clamp(12px,1.6vw,20px);right:clamp(12px,1.6vw,20px);
        bottom:clamp(12px,1.6vw,22px);z-index:2;
        display:flex;align-items:flex-end;justify-content:space-between;
        gap:8px;color:#fff;
        pointer-events:none;
    }
    .series-text{min-width:0;}
    .series-title{
        font-family:var(--serif);
        font-size:clamp(.95rem,1.35vw,1.28rem);
        font-weight:500;line-height:1.2;letter-spacing:-.01em;
        text-shadow:0 1px 12px rgba(0,0,0,.35);
        transition:transform .5s var(--ease);
    }
    .series-item.is-hovered .series-title{transform:translateY(-2px);}
    .series-sub{
        margin-top:5px;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;
        color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .series-cta{
        width:clamp(28px,2.8vw,34px);height:clamp(28px,2.8vw,34px);
        border-radius:50%;border:1px solid rgba(255,255,255,.34);
        display:grid;place-items:center;flex-shrink:0;
        transition:background .45s var(--ease),border-color .45s,transform .6s var(--ease);
    }
    .series-cta svg{width:12px;height:12px;transition:transform .5s var(--ease);}
    .series-item.is-hovered .series-cta{
        background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.72);
        transform:rotate(-45deg);
    }

    /* 页脚 */
    .home-foot{
        max-width: 1440px;
        margin: 0 auto;
        width: 100%;
        padding:40px clamp(20px, 8vw, 100px); 
        border-top:1px solid var(--line);
        display:flex;justify-content:space-between;align-items:center;
        flex-wrap:wrap;gap:10px;
        font-size:.72rem;color:var(--muted);letter-spacing:.03em;
    }

    /* ============ 详情页专属样式 ============ */
    .detail-view {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    
    .detail-hero {
        max-width: 1440px;
        margin: 0 auto;
        width: 100%;
        padding: clamp(100px, 14vh, 140px) clamp(20px, 8vw, 100px) clamp(30px,5vh,60px);
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: clamp(20px,4vw,60px); flex-wrap: wrap;
    }
    
    .back-link {
        display: inline-flex; align-items: center; gap: 8px;
        font-size: .75rem; letter-spacing: .06em; color: var(--muted);
        margin-bottom: 20px; transition: color .25s, gap .3s var(--ease);
    }
    .back-link:hover { color: var(--ink); gap: 12px; }

    .detail-title {
        font-family: var(--serif);
        font-size: clamp(2rem, 4vw, 3.2rem);
        font-weight: 500; line-height: 1.1; letter-spacing: -0.015em;
    }
    .detail-title span {
        font-family: var(--sans); font-size: 0.35em; font-weight: 400; color: var(--muted);
        letter-spacing: .1em; display: inline-block; margin-left: 8px; vertical-align: middle;
    }
    .detail-desc {
        font-size: .9rem; color: #4a463f; line-height: 1.7; max-width: 60ch; margin-top: 16px;
    }

    /* 正方形网格 */
    .works-grid {
        max-width: 1440px;
        margin: 0 auto;
        width: 100%;
        padding: 0 clamp(20px, 8vw, 100px) 80px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(clamp(260px, 28vw, 340px), 1fr));
        gap: clamp(16px, 2.5vw, 28px);
    }

    .work-item {
        position: relative;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        background: #d8d2c7;
        cursor: zoom-in;
        transition: transform 0.5s var(--bounce), box-shadow 0.5s;
    }
    
    .work-item:hover {
        transform: scale(1.03);
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        z-index: 10;
    }

    .work-item img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover;
        transition: transform 1s var(--ease);
        filter: saturate(.9);
    }
    .work-item:hover img {
        transform: scale(1.05);
        filter: saturate(1.05);
    }

    .work-item .series-shade { transition: opacity .4s; }
    .work-item:hover .series-shade { opacity: .9; }
    
    .site-footer {
        margin-top: auto;
        padding: 24px clamp(20px, 8vw, 100px);
        border-top: 1px solid var(--line);
        display: flex; justify-content: space-between; align-items: center;
        font-size: .75rem; color: var(--muted);
    }

    /* ============ 全屏查看器 ============ */
    .lightbox{
        position:fixed;inset:0;z-index:200;
        background:rgba(9,9,9,.975);
        display:flex;flex-direction:column;
        opacity:0;visibility:hidden;
        transition:opacity .45s var(--ease),visibility .45s;
    }
    .lightbox.open{opacity:1;visibility:visible;}
    
    .lb-stage{
        flex:1;display:flex;align-items:center;justify-content:center;
        padding:clamp(40px,6vh,70px) clamp(40px,6vw,100px);min-height:0;
        position:relative;
        overflow:hidden;
        touch-action: none;
    }

    .lb-loader {
        position: absolute;
        width: 36px; height: 36px;
        border: 2px solid rgba(255,255,255,0.1);
        border-top-color: rgba(255,255,255,0.8);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        opacity: 0; transition: opacity 0.3s;
        pointer-events: none;
    }
    .lb-loader.active { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .lb-stage img{
        max-width:100%;max-height:100%;object-fit:contain;
        box-shadow:0 30px 80px rgba(0,0,0,.5);
        opacity: 0;
        transition: opacity 0.4s, transform 0.2s ease-out;
        transform-origin: center center;
        will-change: transform;
        user-select: none;
        -webkit-user-drag: none;
    }
    .lb-stage img.loaded { opacity: 1; }
    .lb-stage.is-zoomed-dragging img { transition: opacity 0.4s, none; }

    .lb-btn{
        position:absolute;z-index:10;display:grid;place-items:center;
        width:52px;height:52px;border-radius:50%;
        border:1px solid rgba(255,255,255,.22);
        color:rgba(255,255,255,.85);background:rgba(255,255,255,.04);
        transition:background .3s,border-color .3s,transform .3s var(--ease);
    }
    .lb-btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5);}
    .lb-close{top:clamp(18px,3vh,32px);right:clamp(18px,3vw,32px);}
    .lb-close:hover{transform:rotate(90deg);}
    
    .lb-zoom-reset {
        top:clamp(18px,3vh,32px);
        right:calc(clamp(18px,3vw,32px) + 64px);
        display: none;
    }
    .lb-zoom-reset.show { display: grid; }
    .lb-zoom-reset:hover { transform: rotate(180deg); }

    .lb-prev{left:clamp(14px,3vw,38px);top:50%;transform:translateY(-50%);}
    .lb-next{right:clamp(14px,3vw,38px);top:50%;transform:translateY(-50%);}

    .lb-bar{
        display:flex;align-items:center;justify-content:space-between;gap:24px;
        padding:clamp(18px,2.6vh,30px) clamp(24px,4vw,56px);
        border-top:1px solid rgba(255,255,255,.1);color:#fff;
        background: rgba(9,9,9,0.6); backdrop-filter: blur(10px);
    }
    .lb-info{display:flex;flex-direction:column;gap:4px;min-width:0;}
    #lb-title{font-family:var(--serif);font-size:clamp(1rem,1.6vw,1.3rem);}
    #lb-meta{font-size:.72rem;letter-spacing:.12em;color:rgba(255,255,255,.55);}
    #lb-count{font-size:.72rem;letter-spacing:.2em;color:rgba(255,255,255,.55);flex-shrink:0;}
    
    .lb-hint {
        position: absolute; bottom: clamp(80px, 12vh, 100px); left: 50%; transform: translateX(-50%);
        font-size: .7rem; color: rgba(255,255,255,0.4); pointer-events: none;
        display: flex; gap: 16px; opacity: 0; transition: opacity 0.3s;
    }
    .lightbox.open .lb-hint { opacity: 1; }

    /* ============ 响应式 ============ */
    @media (max-width:1100px) {
        .cols-4 .series-item { flex: 0 0 clamp(200px, 25vw, 260px); }
        .cols-3 .series-item { flex: 0 0 clamp(220px, 28vw, 280px); }
    }
    @media (max-width:900px){
        .hero{flex-direction:column;align-items:flex-start;gap:16px;}
        .nav{display:none;}
        .detail-hero { flex-direction: column; gap: 20px; }
    }
    @media (max-width:560px){
        .cols-4 .series-item, .cols-3 .series-item { flex: 0 0 clamp(180px, 60vw, 240px); }
        .works-grid { grid-template-columns: 1fr; } 
    }
    @media (max-width:720px){
        .lb-btn{width:44px;height:44px;}
        .lb-stage{padding:20px 10px;}
        .bg-switcher{gap:6px;}
        .bg-dot{width:15px;height:15px;}
        .lb-hint { display: none; }
    }
</style>
</head>
<body>

<header class="site-header" id="siteHeader">
    <div class="header-inner">
        <div class="header-left">
            <a href="#" class="brand" id="brandLink">卍王〇一 <span>Works</span></a>
            <ul class="nav">
                <li><a href="#contact">微信：LANREN-WHL 电话：15228118208</a></li>
            </ul>
        </div>
        <div class="bg-switcher" id="bgSwitcher" aria-label="切换背景"></div>
    </div>
</header>

<!-- 主页视图 -->
<main id="home-view" class="view is-active">
    <div class="home-scroll">
        <section class="hero">
            <div class="hero-left">
                <div class="hero-eyebrow">Selected Works — 2020–2026</div>
                <h1>吴浩林 / Haolin Wu</h1>
            </div>
            <div class="hero-meta">
                <div><span>创作者</span><p>吴浩林</p></div>
                <div><span>类型</span><p>角色 · 场景 · 漫画</p></div>
            </div>
        </section>

        <section class="gallery-section">
            <div class="gallery-title">主推系列 / Main Series</div>
            <div class="series-viewport cols-4" id="viewport-1">
                <div class="series-track" id="track-1"></div>
            </div>
        </section>

        <section class="gallery-section">
            <div class="gallery-title">相关游戏展示 / Related game display</div>
            <div class="series-viewport cols-3" id="viewport-2">
                <div class="series-track" id="track-2"></div>
            </div>
        </section>
    </div>

    <footer class="home-foot" id="about">
        <span>© 2026 卍王〇一。</span>
        <span id="contact">联系：1842719896@qq.com</span>
    </footer>
</main>

<!-- 详情页视图 -->
<section id="series-view" class="view"></section>

<!-- 全屏查看器 -->
<div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-btn lb-zoom-reset" id="lbZoomReset" aria-label="重置大小">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>
        </svg>
    </button>
    <button class="lb-btn lb-close" id="lbClose" aria-label="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="上一张">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="lb-btn lb-next" id="lbNext" aria-label="下一张">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    
    <div class="lb-stage" id="lbStage">
        <div class="lb-loader" id="lbLoader"></div>
        <img id="lbImg" src="" alt="">
        <div class="lb-hint">
            <span>滚轮缩放</span>
            <span>拖拽平移</span>
            <span>双击放大</span>
        </div>
    </div>
    
    <div class="lb-bar">
        <div class="lb-info">
            <span id="lb-title"></span>
            <span id="lb-meta"></span>
        </div>
        <span id="lb-count"></span>
    </div>
</div>

<script>
/* ============================================================
   1. 背景预设
   ============================================================ */
const BG_PRESETS = {
    cream:   { bg:'#f3f0ea', image:'none', overlay:1,    label:'米白' },
    gray:    { bg:'#e8e6e1', image:'none', overlay:1,    label:'浅灰' },
    paper:   { bg:'#f3f0ea', image:'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=1920&q=80', overlay:.88, label:'纸纹' },
    abstract:{ bg:'#f3f0ea', image:'https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=1920&q=80', overlay:.86, label:'抽象' }
};

/* ============================================================
   2. 数据准备
   ============================================================ */
const SERIES_1 = [
    {

function imgUrl(src, w = 1200){
    if (!src) return '';
    if (/^(https?:|images\/|\.\/|\/)/.test(src)) return src;
    return `https://images.unsplash.com/photo-${src}?w=${w}&q=80&auto=format&fit=crop`;
}

   3. 背景切换
   ============================================================ */
const root = document.documentElement;
const bgSwitcher = document.getElementById('bgSwitcher');

function applyBackground(key, save = true){
    const p = BG_PRESETS[key];
    if (!p) return;
    root.style.setProperty('--bg', p.bg);
    root.style.setProperty('--bg-image', p.image === 'none' ? 'none' : `url("${p.image}")`);
    root.style.setProperty('--bg-overlay', p.overlay);
    root.style.setProperty('--header-solid', hexToRgba(p.bg, .82));

    bgSwitcher.querySelectorAll('.bg-dot').forEach(d => {
        d.classList.toggle('active', d.dataset.key === key);
    });

    if (save) {
        try { localStorage.setItem('studio-bg', key); } catch(e){}
    }
}

function hexToRgba(hex, a){
    const h = hex.replace('#','');
    const n = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function renderBgSwitcher(){
    bgSwitcher.innerHTML = Object.entries(BG_PRESETS).map(([key, p]) => {
        const style = p.image === 'none'
            ? `background:${p.bg};`
            : `background-image:url("${p.image}");`;
        return `<button class="bg-dot" data-key="${key}" title="${p.label}" aria-label="背景：${p.label}" style="${style}"></button>`;
    }).join('');

    bgSwitcher.querySelectorAll('.bg-dot').forEach(dot => {
        dot.addEventListener('click', () => applyBackground(dot.dataset.key));
    });
}

/* ============================================================
   4. 通用横向滚动组件（修复不可点击 Bug）
   ============================================================ */
class GalleryScroller {
    constructor(viewport, track, items, renderItemFn, onItemClick) {
        this.viewport = viewport;
        this.track = track;
        this.items = items;
        this.renderItemFn = renderItemFn;
        this.onItemClick = onItemClick;
        
        this.currentX = 0;
        this.targetX = 0;
        this.maxScrollX = 0; 
        
        this.isPointerDown = false;
        this.hasMoved = false;
        this.startX = 0;
        this.startY = 0;
        this.startTargetX = 0;
        this.pressedItem = null; // 记录按下的卡片
        
        this.rafId = null;
        
        this.init();
    }
    
    init() {
        this.track.innerHTML = this.items.map((item, i) => this.renderItemFn(item, i)).join('');
        
        requestAnimationFrame(() => {
            this.calcWidth();
            this.bindEvents();
            this.startLoop();
        });
    }
    
    calcWidth() {
        const first = this.track.firstElementChild;
        if (!first) return;
        const gap = parseFloat(getComputedStyle(this.track).gap) || 0;
        
        const totalWidth = this.items.length * first.offsetWidth + (this.items.length - 1) * gap;
        const viewportWidth = this.viewport.offsetWidth;
        
        // 只有当内容明显超出视口时才允许滚动
        const diff = viewportWidth - totalWidth;
        this.maxScrollX = diff < -10 ? diff : 0; 
        
        this.targetX = Math.max(this.maxScrollX, Math.min(0, this.targetX));
        this.currentX = this.targetX;
        this.updateTransform();
    }
    
    bindEvents() {
        this.viewport.addEventListener('mouseenter', () => {
            window.activeScroller = this;
        });
        
        this.viewport.addEventListener('mouseleave', () => {
            if (window.activeScroller === this) {
                window.activeScroller = null;
            }
        });

        this.viewport.addEventListener('pointerdown', (e) => {
            // 删除 !maxScrollX 的提前返回，允许记录点击
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            
            this.isPointerDown = true;
            this.hasMoved = false;
            this.startX = e.clientX;
            this.startY = e.clientY;
            this.startTargetX = this.targetX;
            this.pressedItem = e.target.closest('.series-item');
        });
        
        window.addEventListener('pointermove', (e) => {
            if (!this.isPointerDown) return;
            
            const dx = e.clientX - this.startX;
            const dy = e.clientY - this.startY;
            
            if (!this.hasMoved && Math.abs(dx) > 8) {
                this.hasMoved = true;
                this.pressedItem = null;
                document.body.classList.add('is-dragging');
                this.track.querySelectorAll('.series-item').forEach(el => el.classList.remove('is-hovered'));
            }
            
            // 只有在真正发生拖拽且有剩余空间时才执行平移
            if (this.hasMoved) {
                e.preventDefault();
                if (this.maxScrollX < 0) {
                    let newX = this.startTargetX + dx;
                    this.targetX = Math.max(this.maxScrollX, Math.min(0, newX));
                }
            }
        }, { passive: false });
        
        window.addEventListener('pointerup', (e) => {
            if (!this.isPointerDown) return;
            
            this.isPointerDown = false;
            document.body.classList.remove('is-dragging');
            
            // 如果没有发生拖拽（位移很小），且确实点到了卡片，则触发点击
            if (!this.hasMoved && this.pressedItem && this.onItemClick) {
                this.onItemClick(this.pressedItem);
            }
            this.pressedItem = null;
        });
        
        window.addEventListener('pointercancel', () => {
            this.isPointerDown = false;
            document.body.classList.remove('is-dragging');
            this.pressedItem = null;
        });
        
        window.addEventListener('resize', () => {
            this.calcWidth();
        });
        
        this.track.addEventListener('mouseover', (e) => {
            if (document.body.classList.contains('is-dragging')) return;
            const item = e.target.closest('.series-item');
            if (item) item.classList.add('is-hovered');
        });
        
        this.track.addEventListener('mouseout', (e) => {
            const item = e.target.closest('.series-item');
            if (item) item.classList.remove('is-hovered');
        });
    }
    
    updateTransform() {
        this.track.style.transform = `translate3d(${this.currentX}px, 0, 0)`;
    }
    
    startLoop() {
        const loop = () => {
            this.currentX += (this.targetX - this.currentX) * 0.15;
            if (Math.abs(this.targetX - this.currentX) < 0.1) {
                this.currentX = this.targetX;
            }
            this.updateTransform();
            this.rafId = requestAnimationFrame(loop);
        };
        loop();
    }
    
    destroy() {
        if (this.rafId) {
            cancelAnimationFrame(this.rafId);
            this.rafId = null;
        }
        if (window.activeScroller === this) {
            window.activeScroller = null;
        }
        document.body.classList.remove('is-dragging');
    }
}

/* ============================================================
   5. 全局滚轮拦截
   ============================================================ */
window.addEventListener('wheel', (e) => {
    const scroller = window.activeScroller;
    if (!scroller || !scroller.maxScrollX || document.body.style.overflow === 'hidden') return;
    
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        let newX = scroller.targetX - e.deltaY;
        scroller.targetX = Math.max(scroller.maxScrollX, Math.min(0, newX));
    }
}, { passive: false });

                    <div><span>尺寸</span><p>${s.size}</p></div>
                    <div><span>地点</span><p>${s.place}</p></div>
                    <div><span>作品数</span><p>${s.works.length} 件</p></div>
                </div>
            </section>

            <div class="works-grid">
                ${s.works.map((w, i) => `
                    <article class="work-item" data-index="${i}" role="button" tabindex="0" aria-label="查看 ${w.title}">
                        <img src="${imgUrl(w.id, 600)}" alt="${w.title}" loading="lazy">
                        <div class="series-shade"></div>
                        <div class="series-num">${String(i + 1).padStart(2, '0')} / ${String(s.works.length).padStart(2, '0')}</div>
                        <div class="series-info">
                            <div class="series-text">
                                <h2 class="series-title">${w.title}</h2>
                                <div class="series-sub">${w.medium} · ${w.year}</div>
                            </div>
                        </div>
                    </article>
                `).join('')}
            </div>
            
            <footer class="site-footer">
                <span>© 2026 你的名字。保留所有权利。</span>
                <span>${s.title} — 系列展示</span>
            </footer>
        </div>
    `;

    seriesView.querySelector('[data-back]').addEventListener('click', e => {
        e.preventDefault();
        goHome();
    });

    seriesView.querySelectorAll('.work-item').forEach(el => {
        el.addEventListener('click', () => {
            const idx = Number(el.dataset.index);
            openLightbox(s, idx);
        });
    });

    showView(seriesView);
    if (pushHistory) {
        try {
            history.pushState({ series: id }, '', '#series-' + id);
        } catch (e) {}
    }
}

function goHome(pushHistory = true) {
    showView(homeView);
    if (pushHistory) {
        try {
            history.pushState({ view: 'home' }, '', location.pathname);
        } catch (e) {}
    }
}

function showView(target) {
    [homeView, seriesView].forEach(v => v.classList.toggle('is-active', v === target));
    window.scrollTo(0, 0);
}

/* ============================================================
   7. 全屏查看器
   ============================================================ */
let lbState = { series: null, index: 0 };
let zoomScale = 1;
let panX = 0;
let panY = 0;
let isZoomDragging = false;
let zoomStartX = 0;
let zoomStartY = 0;
let hasZoomedDragged = false;

function updateImageTransform() {
    lbImg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
    if (zoomScale > 1) {
        lbStage.style.cursor = isZoomDragging ? 'grabbing' : 'grab';
        lbZoomReset.classList.add('show');
    } else {
        lbStage.style.cursor = 'default';
        lbZoomReset.classList.remove('show');
    }
}

function resetZoom() {
    zoomScale = 1; panX = 0; panY = 0;
    updateImageTransform();
}

function openLightbox(series, index) {
    lbState.series = series;
    lbState.index = index;
    renderLightbox();
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
}

function renderLightbox() {
    const works = lbState.series.works;
    const w = works[lbState.index];
    const fullSrc = w.full ? w.full : w.id;

    lbImg.classList.remove('loaded');
    lbImg.src = ''; 
    lbLoader.classList.add('active');
    resetZoom();

    const imgLoader = new Image();
    imgLoader.onload = () => {
        lbImg.src = fullSrc;
        lbImg.alt = w.title;
        lbImg.classList.add('loaded');
        lbLoader.classList.remove('active');
    };
    imgLoader.onerror = () => {
        lbImg.src = w.id; 
        lbImg.classList.add('loaded');
        lbLoader.classList.remove('active');
    };
    imgLoader.src = fullSrc;

    lbTitle.textContent = w.title;
    lbMeta.textContent = `${w.medium} · ${w.year} · ${lbState.series.title}`;
    lbCount.textContent = `${String(lbState.index + 1).padStart(2, '0')} / ${String(works.length).padStart(2, '0')}`;
}

function stepLightbox(dir) {
    const len = lbState.series.works.length;
    lbState.index = (lbState.index + dir + len) % len;
    renderLightbox();
}

function closeLightbox() {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    setTimeout(() => { lbImg.src = ''; resetZoom(); }, 400);
}

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => stepLightbox(-1));
document.getElementById('lbNext').addEventListener('click', () => stepLightbox(1));
lbZoomReset.addEventListener('click', resetZoom);

lightbox.addEventListener('click', e => {
    if (hasZoomedDragged) return;
    if (e.target === lightbox || e.target.classList.contains('lb-stage')) closeLightbox();
});

document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') stepLightbox(-1);
    if (e.key === 'ArrowRight') stepLightbox(1);
});

lbStage.addEventListener('wheel', (e) => {
    if (!lightbox.classList.contains('open') || !lbImg.classList.contains('loaded')) return;
    e.preventDefault();
    const delta = -e.deltaY * 0.002;
    let newScale = zoomScale + delta;
    zoomScale = Math.max(1, Math.min(newScale, 5));
    if (zoomScale === 1) { panX = 0; panY = 0; }
    updateImageTransform();
}, { passive: false });

lbStage.addEventListener('mousedown', (e) => {
    if (zoomScale <= 1) return;
    e.preventDefault();
    isZoomDragging = true;
    hasZoomedDragged = false;
    zoomStartX = e.clientX - panX;
    zoomStartY = e.clientY - panY;
    updateImageTransform();
});

window.addEventListener('mousemove', (e) => {
    if (!isZoomDragging) return;
    e.preventDefault();
    hasZoomedDragged = true;
    panX = e.clientX - zoomStartX;
    panY = e.clientY - zoomStartY;
    updateImageTransform();
});

window.addEventListener('mouseup', () => {
    if (isZoomDragging) {
        isZoomDragging = false;
        updateImageTransform();
        setTimeout(() => { hasZoomedDragged = false; }, 50);
    }
});

lbStage.addEventListener('dblclick', (e) => {
    if (!lbImg.classList.contains('loaded')) return;
    e.preventDefault();
    if (zoomScale > 1) resetZoom();
    else { zoomScale = 2; updateImageTransform(); }
});

let initialPinchDistance = 0;
let initialPinchScale = 1;

lbStage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
        e.preventDefault();
        initialPinchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        initialPinchScale = zoomScale;
        hasZoomedDragged = true; 
    } else if (e.touches.length === 1 && zoomScale > 1) {
        zoomStartX = e.touches[0].clientX - panX;
        zoomStartY = e.touches[0].clientY - panY;
        hasZoomedDragged = false;
    }
}, { passive: false });

lbStage.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
        e.preventDefault();
        const distance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        zoomScale = Math.max(1, Math.min(5, initialPinchScale * (distance / initialPinchDistance)));
        if (zoomScale === 1) { panX = 0; panY = 0; }
        updateImageTransform();
    } else if (e.touches.length === 1 && zoomScale > 1) {
        e.preventDefault();
        hasZoomedDragged = true;
        panX = e.touches[0].clientX - zoomStartX;
        panY = e.touches[0].clientY - zoomStartY;
        updateImageTransform();
    }
}, { passive: false });

lbStage.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) setTimeout(() => { hasZoomedDragged = false; }, 50);
});

document.getElementById('brandLink').addEventListener('click', e => {
    e.preventDefault();
    goHome();
});

document.querySelectorAll('.nav a').forEach(a => {
    a.addEventListener('click', e => {
        const href = a.getAttribute('href');
        if (href === '#works' || href === '#about' || href === '#contact') {
            e.preventDefault();
            goHome(false);
            requestAnimationFrame(() => {
                const target = document.querySelector(href);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        }
    });
});

window.addEventListener('popstate', e => {
    const state = e.state;
    if (state && state.series) openSeries(state.series, false);
    else goHome(false);
});

window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 30);
}, { passive: true });

renderBgSwitcher();
initHome();

let savedBg = 'cream';
try { savedBg = localStorage.getItem('studio-bg') || 'cream'; } catch(e){}
applyBackground(BG_PRESETS[savedBg] ? savedBg : 'cream', false);

const initHash = location.hash.match(/^#series-(.+)$/);
if (initHash) {
    openSeries(initHash[1], false);
} else {
    try {
        history.replaceState({ view: 'home' }, '', location.pathname);
    } catch (e) {}
}
</script>
